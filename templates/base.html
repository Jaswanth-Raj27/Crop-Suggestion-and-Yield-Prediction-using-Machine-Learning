<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>{% block title %}Fieldnote — Crop & Yield{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/lenis/lenis.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css', v='3') }}">
</head>
<body>
<div class="site-shell">
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="Fieldnote home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none"><path d="M20 31V18m0 7c-7 0-11-4-11-11 7 0 11 4 11 11Zm0-5c0-7 4-11 11-11 0 7-4 11-11 11Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 32h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-copy"><strong>fieldnote</strong><small>Crop &amp; Yield</small></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="{% if active_page == 'predictor' %}is-active{% endif %}" href="{{ url_for('home') }}">Predictor <span class="nav-demo">Demo</span></a>
      <a class="{% if active_page == 'history' %}is-active{% endif %}" href="{{ url_for('historical_yields') }}">India yield history</a>
    </nav>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Fieldnote <span class="footer-dot">·</span> agriculture data, with context</span>
    <span>Prototype for exploration. Not agronomic advice.</span>
  </footer>
</div>
<script defer src="{{ url_for('static', filename='vendor/lenis/lenis.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/site.js', v='3') }}"></script>
<script async src="https://mcp.figma.com/mcp/html-to-design/capture.js"></script>
</body>
</html>
